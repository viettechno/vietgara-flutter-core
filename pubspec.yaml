name: vietgara_core
description: Shared core of the VietGara Flutter apps — REST client, session and sign-in, shared widgets, formatting, theme and their vi/en strings.
version: 0.3.0
publish_to: none
repository: https://github.com/viettechno/vietgara-flutter-core

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
